<!DOCTYPE html>
<html style="min-width: 300px; min-height: 350px;">
<head>
  <style>
    /* Absolute fallback to prevent white square */
    body { 
      width: 300px; 
      height: 350px; 
      background: #0f0f0f; 
      margin: 0; 
      display: block !important;
    }
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h2>YT Tracker</h2>
  <div class="stats-container">
    <div>Time Today: <span id="time-display" class="time-val">0</span> min</div>
    <div class="progress-bg">
      <div id="progress-bar"></div>
    </div>
  </div>
  <div class="controls">
    <label>Daily Limit (mins):</label>
    <input type="number" id="limit-input" value="60" min="1">
    <button id="reset-btn">Reset Data</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
